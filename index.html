<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Teleprompter Dark</title>

<style>
*{
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: Arial, Helvetica, sans-serif;
}

body{
  background: #0d0d0d;
  color: #ffffff;
}

/* TELA INICIAL */
.container{
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  padding: 20px;
  text-align: center;
}

textarea{
  width: 100%;
  max-width: 600px;
  height: 150px;
  padding: 15px;
  border-radius: 10px;
  border: none;
  resize: none;
  font-size: 16px;
  margin-bottom: 20px;
  background: #1e1e1e;
  color: white;
}

button{
  padding: 12px 20px;
  border-radius: 8px;
  border: none;
  background: #00c896;
  color: black;
  font-weight: bold;
  cursor: pointer;
  transition: 0.3s;
}

button:hover{
  background: #00a87e;
}

/* TELA LEITOR */
.leitor{
  display: none;
  padding: 20px;
}

.controls{
  position: fixed;
  top: 10px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(0,0,0,0.8);
  padding: 15px;
  border-radius: 12px;
  display: flex;
  gap: 15px;
  align-items: center;
  z-index: 1000;
}

.controls label{
  font-size: 14px;
}

input[type="range"]{
  width: 120px;
}

h1{
  margin-top: 100px;
  line-height: 1.6;
  text-align: center;
  font-weight: normal;
}
</style>
</head>

<body>

<div class="container" id="inicio">
  <h2>Digite seu texto</h2>
  <textarea id="texto"></textarea>
  <button id="iniciar">Iniciar</button>
</div>

<div class="leitor" id="leitor">
  <div class="controls">
    <label>Velocidade</label>
    <input type="range" id="velocidade" min="5" max="100" value="30">

    <label>Tamanho</label>
    <input type="range" id="tamanho" min="20" max="150" value="40">

    <button id="pause">Pausar</button>
    <button id="voltar">Voltar</button>
  </div>

  <h1 id="conteudo"></h1>
</div>

<script>
const btn = document.getElementById('iniciar');
const inicio = document.getElementById('inicio');
const leitor = document.getElementById('leitor');
const conteudo = document.getElementById('conteudo');
const velocidade = document.getElementById('velocidade');
const tamanho = document.getElementById('tamanho');
const pauseBtn = document.getElementById('pause');
const voltarBtn = document.getElementById('voltar');

let scrollInterval;
let pausado = false;

btn.addEventListener('click', () => {
  const texto = document.getElementById('texto').value.trim();
  if (!texto) return;

  conteudo.textContent = texto;

  inicio.style.display = 'none';
  leitor.style.display = 'block';

  window.scrollTo(0,0);
  iniciarScroll();
});

function iniciarScroll(){
  clearInterval(scrollInterval);

  scrollInterval = setInterval(() => {

    if (!pausado) {
      window.scrollBy(0,1);

      // Para quando chega no final
      if (window.innerHeight + window.scrollY >= document.body.offsetHeight){
        clearInterval(scrollInterval);
      }
    }

  }, velocidade.value);
}

velocidade.addEventListener('input', iniciarScroll);

tamanho.addEventListener('input', () => {
  conteudo.style.fontSize = tamanho.value + 'px';
});

pauseBtn.addEventListener('click', () => {
  pausado = !pausado;
  pauseBtn.textContent = pausado ? "Continuar" : "Pausar";
});

voltarBtn.addEventListener('click', () => {
  clearInterval(scrollInterval);
  leitor.style.display = 'none';
  inicio.style.display = 'flex';
  window.scrollTo(0,0);
});
</script>

</body>
</html>
